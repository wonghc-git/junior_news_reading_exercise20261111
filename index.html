<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Junior Chronicle - Reading Comprehension</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #0f172a;
  -webkit-overflow-scrolling: touch;
}

/* Custom subtle scrollbars */
.custom-scroll::-webkit-scrollbar {
  width: 5px;
}
.custom-scroll::-webkit-scrollbar-track {
  background: transparent;
}
.custom-scroll::-webkit-scrollbar-thumb {
  background: rgba(100, 116, 139, 0.28);
  border-radius: 9999px;
}

/* Slide & fade animations */
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(22px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-22px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.985); }
  to { opacity: 1; transform: scale(1); }
}
.anim-right {
  animation: slideInRight 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.anim-left {
  animation: slideInLeft 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.anim-fade {
  animation: fadeInScale 0.18s ease-out forwards;
}

/* ==========================================================================
   KIDS' NEWSPAPER CLIPPING STYLING
   ========================================================================== */
.newsprint-bg {
  background-color: #fdfcf7;
  background-image:
    radial-gradient(rgba(120, 113, 108, 0.06) 1px, transparent 0);
  background-size: 16px 16px;
}
.newspaper-headline {
  font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  line-height: 1.03;
}
.newspaper-body {
  font-family: 'Merriweather', Georgia, Cambria, serif;
  color: #1f2937;
}
.newspaper-body p {
  margin: 0;
  text-align: left;
  break-inside: avoid-column;
}
.newspaper-body p + p {
  margin-top: 0.55rem;
}

/* Editorial Drop Cap on first letter of first paragraph */
.newspaper-body p:first-of-type::first-letter {
  font-family: 'Anton', Georgia, serif;
  float: left;
  font-size: 2.55em;
  line-height: 0.82;
  padding-top: 0.08em;
  padding-right: 0.16em;
  padding-bottom: 0.02em;
  color: var(--story-accent, #dc2626);
  font-weight: 400;
}

/* Editorial Glossary Highlight */
.glossary-word {
  background-color: rgba(253, 224, 71, 0.42);
  border-bottom: 1.5px dashed var(--story-accent, #b91c1c);
  font-weight: 700;
  cursor: pointer;
  padding: 0 2px;
  border-radius: 2px;
  color: #111827;
  transition: all 0.15s ease;
}
.glossary-word:hover {
  background-color: rgba(253, 224, 71, 0.78);
}
.glossary-word:active,
.glossary-word.active-word {
  background-color: var(--story-accent, #1e293b);
  color: #ffffff !important;
  border-bottom-color: transparent;
}

/* Word Watch Cutout Box */
.word-watch-box {
  background-color: #fffef9;
  border: 1.5px dashed #94a3b8;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}

/* Interactive Hint Paragraph Highlighter */
@keyframes hintFlash {
  0% { background-color: #fde047; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.45); }
  100% { background-color: #fef08a; box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
}
.hint-highlighted-para {
  background-color: #fef08a !important;
  border-left: 3.5px solid #f59e0b;
  border-radius: 0.35rem;
  padding: 0.35rem 0.5rem;
  animation: hintFlash 0.65s ease-out;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

/* ==========================================================================
   KAHOOT-STYLE QUIZ STAGE & TILES (NO SHAPES)
   ========================================================================== */
.kahoot-stage {
  background-color: #f2f2f2;
  font-family: 'Montserrat', 'Inter', sans-serif;
}
.kahoot-question-card {
  background: #ffffff;
  border-radius: 0.75rem;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08), 0 6px 16px rgba(0, 0, 0, 0.06);
}
.kahoot-tile {
  font-family: 'Montserrat', 'Inter', sans-serif;
  color: #ffffff;
  border-radius: 0.55rem;
  border-bottom-width: 4px;
  border-bottom-style: solid;
  transition: transform 0.1s ease, filter 0.15s ease, opacity 0.18s ease, box-shadow 0.15s ease;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
  position: relative;
  overflow: hidden;
}
.kahoot-tile:not(:disabled):active {
  transform: translateY(2px);
  border-bottom-width: 2px;
}
.kahoot-tile-red {
  background-color: #e21b3c;
  border-bottom-color: #b3122c;
}
.kahoot-tile-blue {
  background-color: #1368ce;
  border-bottom-color: #0d4d9b;
}
.kahoot-tile-yellow {
  background-color: #d89e00;
  border-bottom-color: #a87a00;
}
.kahoot-tile-green {
  background-color: #26890c;
  border-bottom-color: #1c6608;
}
.kahoot-tile-selected {
  box-shadow: 0 0 0 3px #ffffff, 0 0 0 5.5px #1e293b, 0 6px 14px rgba(0, 0, 0, 0.18);
  transform: translateY(-1px);
  z-index: 2;
}
.kahoot-tile-dimmed {
  opacity: 0.56;
  filter: saturate(0.8);
}
.kahoot-tile-post-dim {
  opacity: 0.28;
  filter: grayscale(0.35);
}
.kahoot-tile-correct {
  box-shadow: 0 0 0 3px #ffffff, 0 0 0 5.5px #16a34a, 0 6px 16px rgba(22, 163, 74, 0.35);
  z-index: 3;
}
.kahoot-tile-wrong {
  box-shadow: 0 0 0 3px #ffffff, 0 0 0 5.5px #dc2626;
  opacity: 0.92;
  z-index: 2;
}

/* ==========================================================================
   FLEXIBLE & ADJUSTABLE DEVICE VIEWPORT SYSTEM (Phone / Tablet / Auto Fit)
   ========================================================================== */
#appFrame {
  transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
              max-width 0.28s cubic-bezier(0.16, 1, 0.3, 1),
              height 0.28s cubic-bezier(0.16, 1, 0.3, 1),
              border-radius 0.25s ease;
}

/* 1. PHONE MODE (Compact Stacked Layout ~412px) */
#appFrame[data-view="phone"] {
  width: 100%;
  max-width: 412px;
  height: 100dvh;
  max-height: 850px;
}
@media (min-width: 640px) {
  #appFrame[data-view="phone"] {
    height: calc(100dvh - 54px);
    border-radius: 1.75rem;
    border-width: 5px;
    border-color: #1e293b;
  }
}
#appFrame[data-view="phone"] #mainContentWrapper {
  flex-direction: column;
}
#appFrame[data-view="phone"] #topHalf {
  height: 49%;
  min-height: 235px;
  width: 100%;
  border-bottom-width: 2px;
  border-right-width: 0px;
}
#appFrame[data-view="phone"] #bottomHalf {
  height: 51%;
  min-height: 255px;
  width: 100%;
}
#appFrame[data-view="phone"] #articleText {
  column-count: 1;
  font-size: 11.4px;
  line-height: 1.5;
}
#appFrame[data-view="phone"] #articleTitle {
  font-size: 1.25rem;
}
#appFrame[data-view="phone"] #kahootCounterCircle {
  width: 2rem;
  height: 2rem;
  font-size: 0.72rem;
}
#appFrame[data-view="phone"] #kahootSkipBtn {
  font-size: 0.68rem;
  padding: 0.25rem 0.5rem;
}
#appFrame[data-view="phone"] #questionText {
  font-size: 0.8rem;
  line-height: 1.28;
}
#appFrame[data-view="phone"] .kahoot-tile {
  padding: 0.45rem 0.55rem;
  min-height: 48px;
  font-size: 0.72rem;
  line-height: 1.2;
}

/* 2. TABLET PORTRAIT MODE (Spacious Stacked ~768px) */
#appFrame[data-view="tablet-portrait"] {
  width: 100%;
  max-width: 768px;
  height: 100dvh;
  max-height: 990px;
}
@media (min-width: 640px) {
  #appFrame[data-view="tablet-portrait"] {
    height: calc(100dvh - 54px);
    border-radius: 2rem;
    border-width: 6px;
    border-color: #1e293b;
  }
}
#appFrame[data-view="tablet-portrait"] #mainContentWrapper {
  flex-direction: column;
}
#appFrame[data-view="tablet-portrait"] #topHalf {
  height: 50%;
  min-height: 280px;
  width: 100%;
  border-bottom-width: 2px;
  border-right-width: 0px;
}
#appFrame[data-view="tablet-portrait"] #bottomHalf {
  height: 50%;
  min-height: 290px;
  width: 100%;
}
#appFrame[data-view="tablet-portrait"] #articleText {
  column-count: 2;
  column-gap: 1.25rem;
  column-rule: 1px solid #e2ddd0;
  font-size: 12.6px;
  line-height: 1.58;
}
#appFrame[data-view="tablet-portrait"] #articleTitle {
  font-size: 1.8rem;
}
#appFrame[data-view="tablet-portrait"] #editorialFigureWrap {
  max-width: 440px;
  margin-left: auto;
  margin-right: auto;
}
#appFrame[data-view="tablet-portrait"] #kahootCounterCircle {
  width: 2.75rem;
  height: 2.75rem;
  font-size: 0.88rem;
}
#appFrame[data-view="tablet-portrait"] #kahootSkipBtn {
  font-size: 0.8rem;
  padding: 0.35rem 0.8rem;
}
#appFrame[data-view="tablet-portrait"] #questionText {
  font-size: 1.02rem;
  line-height: 1.35;
}
#appFrame[data-view="tablet-portrait"] .kahoot-tile {
  padding: 0.75rem 0.9rem;
  min-height: 68px;
  font-size: 0.9rem;
  line-height: 1.28;
}

/* 3. TABLET LANDSCAPE / SPLIT MODE (Side-by-Side Split View ~1080px) */
#appFrame[data-view="tablet-landscape"] {
  width: 100%;
  max-width: 1080px;
  height: 100dvh;
  max-height: 760px;
}
@media (min-width: 640px) {
  #appFrame[data-view="tablet-landscape"] {
    height: calc(100dvh - 54px);
    border-radius: 2rem;
    border-width: 6px;
    border-color: #1e293b;
  }
}
#appFrame[data-view="tablet-landscape"] #mainContentWrapper {
  flex-direction: row;
}
#appFrame[data-view="tablet-landscape"] #topHalf {
  height: 100%;
  width: 50%;
  min-height: 0;
  border-bottom-width: 0px;
  border-right-width: 2px;
}
#appFrame[data-view="tablet-landscape"] #bottomHalf {
  height: 100%;
  width: 50%;
  min-height: 0;
}
#appFrame[data-view="tablet-landscape"] #articleText {
  column-count: 2;
  column-gap: 1.1rem;
  column-rule: 1px solid #e2ddd0;
  font-size: 12.2px;
  line-height: 1.56;
}
#appFrame[data-view="tablet-landscape"] #articleTitle {
  font-size: 1.7rem;
}
#appFrame[data-view="tablet-landscape"] #kahootCounterCircle {
  width: 2.85rem;
  height: 2.85rem;
  font-size: 0.9rem;
}
#appFrame[data-view="tablet-landscape"] #kahootSkipBtn {
  font-size: 0.8rem;
  padding: 0.35rem 0.8rem;
}
#appFrame[data-view="tablet-landscape"] #questionText {
  font-size: 1.08rem;
  line-height: 1.35;
}
#appFrame[data-view="tablet-landscape"] .kahoot-tile {
  padding: 0.85rem 0.95rem;
  min-height: 82px;
  font-size: 0.92rem;
  line-height: 1.3;
}

/* Shared Tablet enhancements */
#appFrame[data-view="tablet-portrait"] #topHeader,
#appFrame[data-view="tablet-landscape"] #topHeader {
  padding: 0.45rem 1rem;
}
#appFrame[data-view="tablet-portrait"] #headerTitleText,
#appFrame[data-view="tablet-landscape"] #headerTitleText {
  font-size: 0.92rem;
}
#appFrame[data-view="tablet-portrait"] .q-tab-btn,
#appFrame[data-view="tablet-landscape"] .q-tab-btn {
  padding: 0.25rem 0.65rem;
  font-size: 0.78rem;
}
#appFrame[data-view="tablet-portrait"] #prevQBtn,
#appFrame[data-view="tablet-landscape"] #prevQBtn,
#appFrame[data-view="tablet-portrait"] #nextQBtn,
#appFrame[data-view="tablet-landscape"] #nextQBtn {
  font-size: 0.8rem;
  padding: 0.4rem 0.8rem;
}
#appFrame[data-view="tablet-portrait"] #submitQuizBtn,
#appFrame[data-view="tablet-landscape"] #submitQuizBtn {
  font-size: 0.84rem;
  padding: 0.45rem 0.9rem;
}
</style>
</head>
<body class="flex flex-col items-center justify-start sm:justify-center w-full min-h-[100dvh] bg-slate-900 sm:p-2 gap-1.5">

<!-- ================= FLEXIBLE DEVICE & VIEWPORT SWITCHER BAR ================= -->
<div id="deviceToolbar" class="w-full max-w-[1080px] px-2.5 py-1 bg-slate-800/90 backdrop-blur-md text-slate-200 sm:rounded-full border-b sm:border border-slate-700/80 flex items-center justify-between gap-2 text-[11px] shrink-0 z-30 shadow-md">
  <div class="flex items-center gap-1.5 min-w-0">
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
    <span class="font-bold text-slate-300 truncate hidden sm:inline">Display Size:</span>
    <span id="activeSizeLabel" class="text-[10px] font-semibold text-sky-300 bg-slate-900/80 px-2 py-0.5 rounded-full border border-slate-700 truncate">Auto Fit</span>
  </div>
  <div class="flex items-center gap-1 shrink-0" role="group" aria-label="Device Viewport Presets">
    <button type="button" onclick="setViewportMode('auto')" id="modeBtn-auto" class="mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 bg-sky-600 text-white shadow-xs">
      <span>✨</span><span>Auto</span>
    </button>
    <button type="button" onclick="setViewportMode('phone')" id="modeBtn-phone" class="mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 text-slate-300 hover:bg-slate-700/70">
      <span>📱</span><span>Phone</span>
    </button>
    <button type="button" onclick="setViewportMode('tablet-portrait')" id="modeBtn-tablet-portrait" class="mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 text-slate-300 hover:bg-slate-700/70">
      <span>📟</span><span class="hidden md:inline">Tablet</span><span>Portrait</span>
    </button>
    <button type="button" onclick="setViewportMode('tablet-landscape')" id="modeBtn-tablet-landscape" class="mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 text-slate-300 hover:bg-slate-700/70">
      <span>💻</span><span class="hidden md:inline">Tablet</span><span>Split</span>
    </button>
  </div>
</div>

<!-- ================= MAIN APP FRAME ================= -->
<div id="appFrame" data-view="phone" class="relative bg-white sm:shadow-2xl flex flex-col overflow-hidden transition-colors duration-300">

  <!-- Top Navigation Bar -->
  <header id="topHeader" class="px-2.5 py-1.5 text-white flex items-center justify-between shrink-0 shadow-sm transition-colors duration-300 z-10">
    <button id="prevArticleBtn" onclick="changeArticle(-1)" aria-label="Previous Story" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 flex items-center justify-center transition">
      <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="flex items-center gap-2 min-w-0">
      <span id="headerTitleText" class="text-xs font-extrabold tracking-tight truncate">Junior News Reading Exercise</span>
      <div id="articleDots" class="flex items-center gap-1 shrink-0"></div>
    </div>
    <button id="nextArticleBtn" onclick="changeArticle(1)" aria-label="Next Story" class="w-6 h-6 sm:w-7 sm:h-7 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 flex items-center justify-center transition">
      <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </header>

  <!-- Responsive Split Wrapper -->
  <div id="mainContentWrapper" class="flex-1 flex flex-col min-h-0 w-full overflow-hidden">

    <!-- ======================================================================
         1. ARTICLE SECTION — KIDS' NEWSPAPER / MAGAZINE CLIPPING
         ====================================================================== -->
    <section id="topHalf" class="h-[49%] min-h-[235px] w-full flex flex-col bg-stone-200/80 border-stone-300 relative overflow-hidden select-none shrink-0 p-1.5 sm:p-2">
      <!-- Crisp Print Clipping Sheet -->
      <article id="articleContainer" class="newsprint-bg flex-1 flex flex-col min-h-0 overflow-hidden rounded-sm border border-stone-300 shadow-[0_2px_8px_rgba(15,23,42,0.12)] px-2.5 sm:px-3.5 py-2">

        <!-- Newspaper Masthead Strip -->
        <div class="shrink-0 flex items-center justify-between gap-2 pb-1 mb-1.5 border-b-2 border-stone-800">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="text-[9px] sm:text-[10px] font-black tracking-widest uppercase text-stone-800 truncate">
              THE JUNIOR CHRONICLE • HONG KONG
            </span>
          </div>
          <span id="articleCategory" class="inline-flex items-center text-[8.5px] sm:text-[9.5px] font-extrabold uppercase tracking-wider px-1.5 py-0.5 rounded-xs text-white shrink-0"></span>
        </div>

        <!-- Scrollable Newspaper Content (Headline + Feature Illustration + Print Columns) -->
        <div id="articleScrollArea" class="custom-scroll flex-1 overflow-y-auto pr-1 min-h-0">
          <!-- Punchy Condensed Uppercase Headline -->
          <h1 id="articleTitle" class="newspaper-headline tracking-tight mb-1"></h1>

          <!-- Byline & Swipe Hint Row -->
          <div class="flex items-center justify-between gap-2 pb-1.5 mb-2 border-b border-stone-300/90">
            <p id="articleByline" class="text-[9.5px] sm:text-[10.5px] italic text-stone-600 font-medium truncate"></p>
            <span id="storySwipeHint" class="text-[9px] sm:text-[10px] font-bold text-stone-500 shrink-0">
              ↔ Swipe story
            </span>
          </div>

          <!-- 16:9 Editorial Feature Image Frame + Solid-Bar Newspaper Caption -->
          <figure id="editorialFigureWrap" class="w-full mb-2.5 rounded-xs overflow-hidden border border-stone-300 shadow-xs bg-white">
            <div class="relative w-full aspect-video overflow-hidden bg-stone-100">
              <!-- Inline SVG Editorial Illustration (Locked) -->
              <div id="articleIllustration" class="w-full h-full"></div>
            </div>
            <!-- Colorful Solid-Bar Newspaper Caption Strip -->
            <figcaption id="articleCaptionBar" class="px-2 py-1 text-[9.5px] sm:text-[10.5px] font-bold text-white leading-tight tracking-tight"></figcaption>
          </figure>

          <!-- Print-Style Serif Body Text (1-col Phone / 2-col Tablet with Drop Cap) -->
          <div id="articleText" class="newspaper-body pb-1"></div>
        </div>

        <!-- Compact "WORD WATCH" Newspaper Cutout Box -->
        <div id="glossaryBar" class="word-watch-box shrink-0 mt-1.5 rounded-xs px-2 py-1 flex items-center justify-between gap-2 min-h-[28px]">
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <span id="glossaryBadge" class="text-[8.5px] sm:text-[9px] font-black uppercase tracking-wider text-white px-1.5 py-0.5 rounded-xs shrink-0">WORD WATCH</span>
            <p id="glossaryContent" class="text-[10.5px] sm:text-[11.5px] text-stone-700 truncate font-medium">
              Tap a highlighted word for its meaning!
            </p>
          </div>
        </div>
      </article>
    </section>

    <!-- ======================================================================
         2. QUESTION & ANSWER CHOICES SECTION — KAHOOT-STYLE STAGE (NO SHAPES)
         ====================================================================== -->
    <section id="bottomHalf" class="kahoot-stage h-[51%] min-h-[255px] flex-1 w-full flex flex-col justify-between px-2.5 sm:px-4 py-2 relative overflow-hidden select-none">

      <!-- Top Control Strip: Q1-Q4 Pill Tabs + Score/Status -->
      <div class="flex items-center justify-between gap-1.5 shrink-0 pb-1.5 border-b border-slate-300/70">
        <div id="questionTabs" class="flex items-center gap-1"></div>
        <div class="flex items-center gap-1.5">
          <span id="questionSkillTag" class="text-[9.5px] sm:text-[10.5px] font-extrabold px-2 py-0.5 rounded-full bg-white text-slate-700 border border-slate-300/80 shadow-2xs"></span>
          <button id="summaryToggleBtn" onclick="toggleSummaryModal()" class="hidden text-[9.5px] sm:text-[10.5px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-800 text-white hover:bg-slate-700 active:scale-95 transition shadow-xs">
            All 4 Key
          </button>
        </div>
      </div>

      <!-- Kahoot Stage Middle + 2x2 Colored Answer Tiles -->
      <div id="questionSwipeArea" class="flex-1 flex flex-col justify-between gap-2 py-1.5 min-h-0 overflow-y-auto custom-scroll">

        <!-- Kahoot Question Stage Row: Purple Counter Circle (Left) + White Question Card (Center) + Blue Action/Skip Button (Right) -->
        <div class="flex items-center justify-between gap-2 sm:gap-3 shrink-0 my-auto">
          <!-- Left: Circular Purple Question Counter Badge -->
          <div id="kahootCounterCircle" class="rounded-full bg-[#864cbf] text-white font-black flex items-center justify-center shrink-0 shadow-md border-2 border-white">
            1/4
          </div>

// ============================================================================
// STATE MANAGEMENT
// ============================================================================
let currentArticleIdx = 0;
const currentQuestionIndices = [0, 0, 0, 0, 0];
const userAnswers = articles.map(() => [null, null, null, null]);
const storySubmitted = [false, false, false, false, false];
// Track whether the paragraph hint highlight is currently active
let isHintActive = false;
const letters = ["A", "B", "C", "D"];
const kahootTileClasses = [
  "kahoot-tile-red",
  "kahoot-tile-blue",
  "kahoot-tile-yellow",
  "kahoot-tile-green"
];

// ============================================================================
// FLEXIBLE DEVICE VIEWPORT MODE CONTROLLER (Auto / Phone / Tablet Portrait / Tablet Split)
// ============================================================================
let currentViewportMode = "auto";

function resolveAutoView() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (w >= 920 || (w >= 760 && w > h * 1.15)) {
    return "tablet-landscape";
  } else if (w >= 600) {
    return "tablet-portrait";
  }
  return "phone";
}

function setViewportMode(mode) {
  currentViewportMode = mode;
  applyViewportLayout();
}

function applyViewportLayout() {
  const appFrame = document.getElementById("appFrame");
  const effectiveView = currentViewportMode === "auto" ? resolveAutoView() : currentViewportMode;
  appFrame.setAttribute("data-view", effectiveView);

  const modes = ["auto", "phone", "tablet-portrait", "tablet-landscape"];
  modes.forEach(m => {
    const btn = document.getElementById(`modeBtn-${m}`);
    if (!btn) return;
    if (m === currentViewportMode) {
      btn.className = "mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 bg-sky-600 text-white shadow-xs";
    } else {
      btn.className = "mode-btn px-2 py-0.5 rounded-full font-bold text-[10.5px] transition flex items-center gap-1 text-slate-300 hover:bg-slate-700/70";
    }
  });

  const labelMap = {
    "phone": "Phone (Compact)",
    "tablet-portrait": "Tablet Portrait",
    "tablet-landscape": "Tablet Split-View"
  };
  const activeLabel = document.getElementById("activeSizeLabel");
  if (activeLabel) {
    activeLabel.textContent = currentViewportMode === "auto"
      ? `Auto • ${labelMap[effectiveView]}`
      : labelMap[effectiveView];
  }
}

window.addEventListener("resize", () => {
  if (currentViewportMode === "auto") {
    applyViewportLayout();
  }
});

// ============================================================================
// EDITORIAL ILLUSTRATION RENDERER (LOCKED)
// ============================================================================
function renderArticleImage() {
  const art = articles[currentArticleIdx];
  const svgContainer = document.getElementById("articleIllustration");
  if (svgContainer) {
    svgContainer.innerHTML = storyIllustrations[art.id] || "";
  }
}

// ============================================================================
// RENDER FUNCTIONS
// ============================================================================
function renderAll(articleAnim = "fade", questionAnim = "fade") {
  clearHintHighlight();
  applyStoryTheme();
  renderTopNavigation();
  renderArticle(articleAnim);
  renderBottomSection(questionAnim);
}

function applyStoryTheme() {
  const t = articles[currentArticleIdx].theme;
  document.documentElement.style.setProperty("--story-accent", t.accentHex);

  const topHeader = document.getElementById("topHeader");
  const categoryBadge = document.getElementById("articleCategory");
  const articleTitle = document.getElementById("articleTitle");
  const captionBar = document.getElementById("articleCaptionBar");
  const glossaryBadge = document.getElementById("glossaryBadge");

  if (topHeader) topHeader.style.background = t.headerGrad;
  if (categoryBadge) categoryBadge.style.backgroundColor = t.accentHex;
  if (articleTitle) articleTitle.style.color = t.accentHex;
  if (captionBar) captionBar.style.backgroundColor = t.accentHex;
  if (glossaryBadge) glossaryBadge.style.backgroundColor = t.accentHex;
}

function renderTopNavigation() {
  const dotsContainer = document.getElementById("articleDots");
  if (!dotsContainer) return;
  dotsContainer.innerHTML = "";
  articles.forEach((art, idx) => {
    const isSubmitted = storySubmitted[idx];
    const dot = document.createElement("button");
    dot.setAttribute("aria-label", `Go to Story ${idx + 1}`);
    dot.onclick = () => jumpToArticle(idx);

    if (idx === currentArticleIdx) {
      dot.className = "w-5 h-2 rounded-full bg-white transition-all shadow-xs";
    } else if (isSubmitted) {
      dot.className = "w-2 h-2 rounded-full bg-emerald-300 hover:bg-white transition-all";
    } else {
      dot.className = "w-2 h-2 rounded-full bg-white/45 hover:bg-white/75 transition-all";
    }
    dotsContainer.appendChild(dot);
  });
}

function renderArticle(direction) {
  const art = articles[currentArticleIdx];
  const t = art.theme;
  const container = document.getElementById("articleContainer");
  if (container) {
    container.classList.remove("anim-left", "anim-right", "anim-fade");
    void container.offsetWidth;
    container.classList.add(
      direction === "next" ? "anim-right" : direction === "prev" ? "anim-left" : "anim-fade"
    );
  }

  document.getElementById("articleCategory").textContent = art.category;
  document.getElementById("articleTitle").textContent = art.title;
  document.getElementById("articleByline").textContent = art.byline;
  document.getElementById("articleCaptionBar").textContent = art.caption;

  renderArticleImage();

  const textEl = document.getElementById("articleText");
  textEl.innerHTML = art.paragraphs
    .map((p, idx) => `<p data-para-idx="${idx}">${p}</p>`)
    .join("");

  const scrollArea = document.getElementById("articleScrollArea");
  if (scrollArea) scrollArea.scrollTop = 0;

  const glossaryContent = document.getElementById("glossaryContent");
  glossaryContent.innerHTML = `Tap any <span style="color:${t.accentHex}" class="font-bold underline decoration-dashed">highlighted word</span> above for its meaning!`;

  const wordSpans = textEl.querySelectorAll(".glossary-word");
  wordSpans.forEach(span => {
    span.addEventListener("click", (e) => {
      e.stopPropagation();
      wordSpans.forEach(s => s.classList.remove("active-word"));
      span.classList.add("active-word");
      const key = span.getAttribute("data-word");
      const meaning = art.glossary[key];
      if (meaning) {
        glossaryContent.innerHTML = `<strong style="color:${t.accentHex}" class="uppercase text-[10px] mr-1">${key}:</strong> ${meaning}`;
      }
    });
  });
}

function renderBottomSection(questionAnim = "fade") {
  const art = articles[currentArticleIdx];
  const t = art.theme;
  const qIdx = currentQuestionIndices[currentArticleIdx];
  const qObj = art.questions[qIdx];
  const answers = userAnswers[currentArticleIdx];
  const isSubmitted = storySubmitted[currentArticleIdx];

  // Animate Question Area when changing questions
  const swipeArea = document.getElementById("questionSwipeArea");
  if (swipeArea) {
    swipeArea.classList.remove("anim-left", "anim-right", "anim-fade");
    void swipeArea.offsetWidth;
    swipeArea.classList.add(
      questionAnim === "next" ? "anim-right" : questionAnim === "prev" ? "anim-left" : "anim-fade"
    );
  }

  // 1. Render Q1 - Q4 Pill Tabs
  const tabsContainer = document.getElementById("questionTabs");
  tabsContainer.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const btn = document.createElement("button");
    btn.onclick = () => jumpToQuestion(i);
    const isCurrent = i === qIdx;
    const hasAns = answers[i] !== null;

    let statusIcon = "";
    let baseClasses = "q-tab-btn px-2 py-0.5 rounded-full text-[10.5px] font-extrabold transition-all flex items-center gap-0.5 border ";

    if (isSubmitted) {
      const isCorrect = answers[i] === art.questions[i].correct;
      statusIcon = isCorrect ? "✓" : "✕";
      if (isCurrent) {
        baseClasses += isCorrect
          ? "bg-emerald-600 text-white border-emerald-700 shadow-xs"
          : "bg-rose-600 text-white border-rose-700 shadow-xs";
      } else {
        baseClasses += isCorrect
          ? "bg-emerald-100 text-emerald-800 border-emerald-300"
          : "bg-rose-100 text-rose-800 border-rose-300";
      }
    } else {
      if (isCurrent) {
        baseClasses += "bg-[#864cbf] text-white border-[#6f3aa3] shadow-xs";
      } else if (hasAns) {
        baseClasses += "bg-white text-slate-800 border-slate-300";
        statusIcon = "•";
      } else {
        baseClasses += "bg-white/70 text-slate-500 border-slate-300/70";
      }
    }

    btn.className = baseClasses;
    btn.innerHTML = `<span>Q${i + 1}</span>${statusIcon ? `<span class="text-[9.5px]">${statusIcon}</span>` : ""}`;
    tabsContainer.appendChild(btn);
  }

  // 2. Skill Tag & All-4 Summary Button
  const skillTag = document.getElementById("questionSkillTag");
  const summaryBtn = document.getElementById("summaryToggleBtn");

  if (isSubmitted) {
    const score = answers.reduce((acc, ans, idx) => acc + (ans === art.questions[idx].correct ? 1 : 0), 0);
    skillTag.textContent = `Score: ${score}/4`;
    skillTag.className = score >= 3
      ? "text-[9.5px] sm:text-[10.5px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 shadow-2xs"
      : "text-[9.5px] sm:text-[10.5px] font-extrabold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 shadow-2xs";
    summaryBtn.classList.remove("hidden");
  } else {
    skillTag.textContent = qObj.skill;
    skillTag.className = "text-[9.5px] sm:text-[10.5px] font-extrabold px-2 py-0.5 rounded-full bg-white text-slate-700 border border-slate-300/80 shadow-2xs";
    summaryBtn.classList.add("hidden");
    toggleSummaryModal(false);
  }

  // 3. Kahoot Purple Counter Circle, Question Prompt & Blue Action Button
  document.getElementById("kahootCounterCircle").textContent = `${qIdx + 1}/4`;
  document.getElementById("questionText").textContent = qObj.q;

  const skipBtn = document.getElementById("kahootSkipBtn");
  const answeredCount = answers.filter(a => a !== null).length;
  if (qIdx < 3) {
    skipBtn.textContent = "Next";
  } else if (!isSubmitted && answeredCount === 4) {
    skipBtn.textContent = "Submit";
  } else if (isSubmitted) {
    skipBtn.textContent = "Key";
  } else {
    skipBtn.textContent = "Q1";
  }

  // 4. Render 2x2 Kahoot Solid-Color Tiles (NO SHAPES)
  const optionsList = document.getElementById("optionsList");
  optionsList.innerHTML = "";
  const currentSelection = answers[qIdx];

  qObj.options.forEach((optText, optIdx) => {
    const isSelected = currentSelection === optIdx;
    const isCorrectOption = qObj.correct === optIdx;
    const btn = document.createElement("button");
    btn.type = "button";

    let tileClasses = `kahoot-tile ${kahootTileClasses[optIdx]} w-full text-left font-bold flex items-center justify-between gap-2 cursor-pointer `;
    let statusBadge = "";

    if (!isSubmitted) {
      btn.onclick = () => selectOption(optIdx);
      if (isSelected) {
        tileClasses += "kahoot-tile-selected";
        statusBadge = `<span class="shrink-0 w-5 h-5 rounded-full bg-white text-slate-900 text-[11px] font-black flex items-center justify-center shadow-xs">✓</span>`;
      } else if (currentSelection !== null) {
        tileClasses += "kahoot-tile-dimmed";
      }
    } else {
      btn.disabled = true;
      tileClasses = tileClasses.replace("cursor-pointer", "cursor-default");
      if (isCorrectOption) {
        tileClasses += "kahoot-tile-correct";
        statusBadge = `<span class="shrink-0 px-1.5 py-0.5 rounded bg-white text-emerald-700 text-[9.5px] font-black shadow-xs">${isSelected ? "✓ Yours" : "✓ Ans"}</span>`;
      } else if (isSelected && !isCorrectOption) {
        tileClasses += "kahoot-tile-wrong";
        statusBadge = `<span class="shrink-0 px-1.5 py-0.5 rounded bg-white text-rose-700 text-[9.5px] font-black shadow-xs">✕ Yours</span>`;
      } else {
        tileClasses += "kahoot-tile-post-dim";
      }
    }

    btn.className = tileClasses;
    btn.innerHTML = `
      <span class="flex-1 break-words">${optText}</span>
      ${statusBadge}
    `;
    optionsList.appendChild(btn);
  });

  // 5. Bottom Prev / Submit / Next Controls
  document.getElementById("prevQBtn").disabled = qIdx === 0;
  document.getElementById("nextQBtn").disabled = qIdx === 3;

  const submitBtn = document.getElementById("submitQuizBtn");
  if (!isSubmitted) {
    if (answeredCount === 4) {
      submitBtn.disabled = false;
      submitBtn.style.backgroundColor = t.accentHex;
      submitBtn.className = "w-full py-1.5 px-3 rounded-lg font-extrabold text-[11px] text-white shadow-sm transition-all flex items-center justify-center gap-1 active:scale-95 cursor-pointer";
      submitBtn.innerHTML = `<span>Submit Answers (4/4)</span><span>✓</span>`;
    } else {
      submitBtn.disabled = true;
      submitBtn.style.backgroundColor = "";
      submitBtn.className = "w-full py-1.5 px-3 rounded-lg font-bold text-[10.5px] transition-all flex items-center justify-center gap-1 bg-white/80 text-slate-400 border border-slate-300";
      submitBtn.innerHTML = `<span>Answer all 4 (${answeredCount}/4)</span>`;
    }
  } else {
    submitBtn.disabled = false;
    submitBtn.style.backgroundColor = "#1e293b";
    submitBtn.className = "w-full py-1.5 px-3 rounded-lg font-extrabold text-[11px] text-white shadow-sm transition-all flex items-center justify-center gap-1 active:scale-95 cursor-pointer";
    submitBtn.innerHTML = `<span>View All 4 Answers</span>`;
  }
}

// ============================================================================
// INTERACTIVE HINT CONTROLLER
// ============================================================================
function clearHintHighlight() {
  isHintActive = false;
  const textEl = document.getElementById("articleText");
  if (textEl) {
    textEl.querySelectorAll(".hint-highlighted-para").forEach(p => {
      p.classList.remove("hint-highlighted-para");
    });
  }
  const hintBtn = document.getElementById("hintBtn");
  const hintBtnText = document.getElementById("hintBtnText");
  if (hintBtn) {
    hintBtn.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] sm:text-[10.5px] font-extrabold tracking-wide border transition-all active:scale-95 bg-amber-50 hover:bg-amber-100 text-amber-800 border-amber-300 shadow-2xs";
  }
  if (hintBtnText) {
    hintBtnText.textContent = "HINT";
  }
}

function toggleQuestionHint() {
  if (isHintActive) {
    clearHintHighlight();
    return;
  }

  const art = articles[currentArticleIdx];
  const qIdx = currentQuestionIndices[currentArticleIdx];
  const hintParaIdx = art.questions[qIdx].hintPara;
  const textEl = document.getElementById("articleText");
  if (!textEl) return;

  const targetPara = textEl.querySelector(`p[data-para-idx="${hintParaIdx}"]`);
  if (targetPara) {
    isHintActive = true;
    targetPara.classList.add("hint-highlighted-para");
    targetPara.scrollIntoView({ behavior: "smooth", block: "nearest" });

    const hintBtn = document.getElementById("hintBtn");
    const hintBtnText = document.getElementById("hintBtnText");
    if (hintBtn) {
      hintBtn.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] sm:text-[10.5px] font-extrabold tracking-wide border transition-all active:scale-95 bg-amber-400 text-amber-950 border-amber-500 shadow-xs";
    }
    if (hintBtnText) {
      hintBtnText.textContent = "HINT ON";
    }
  }
}

// ============================================================================
// INTERACTION HANDLERS
// ============================================================================
function selectOption(optIdx) {
  if (storySubmitted[currentArticleIdx]) return;
  const qIdx = currentQuestionIndices[currentArticleIdx];
  userAnswers[currentArticleIdx][qIdx] = optIdx;
  renderBottomSection("fade");
}

function changeQuestion(delta) {
  const curQ = currentQuestionIndices[currentArticleIdx];
  const nextQ = curQ + delta;
  if (nextQ >= 0 && nextQ < 4) {
    clearHintHighlight();
    currentQuestionIndices[currentArticleIdx] = nextQ;
    renderBottomSection(delta > 0 ? "next" : "prev");
  }
}

function handleKahootActionBtn() {
  const curQ = currentQuestionIndices[currentArticleIdx];
  const answers = userAnswers[currentArticleIdx];
  const isSubmitted = storySubmitted[currentArticleIdx];

  if (curQ < 3) {
    changeQuestion(1);
  } else if (!isSubmitted && answers.every(a => a !== null)) {
    submitCurrentStory();
  } else if (isSubmitted) {
    toggleSummaryModal(true);
  } else {
    jumpToQuestion(0);
  }
}

function jumpToQuestion(idx) {
  const curQ = currentQuestionIndices[currentArticleIdx];
  if (idx === curQ) {
    toggleSummaryModal(false);
    return;
  }
  clearHintHighlight();
  const dir = idx > curQ ? "next" : "prev";
  currentQuestionIndices[currentArticleIdx] = idx;
  toggleSummaryModal(false);
  renderBottomSection(dir);
}

function submitCurrentStory() {
  const answers = userAnswers[currentArticleIdx];
  if (!storySubmitted[currentArticleIdx]) {
    if (answers.some(a => a === null)) return;
    storySubmitted[currentArticleIdx] = true;
    renderTopNavigation();
    renderBottomSection("fade");
    populateSummaryOverlay();
    toggleSummaryModal(true);
  } else {
    populateSummaryOverlay();
    toggleSummaryModal();
  }
}

function populateSummaryOverlay() {
  const art = articles[currentArticleIdx];
  const answers = userAnswers[currentArticleIdx];
  let score = 0;
  answers.forEach((a, i) => {
    if (a === art.questions[i].correct) score++;
  });

  document.getElementById("overlayScoreTitle").textContent = `${art.title} • Score: ${score}/4`;
  const list = document.getElementById("overlayList");
  list.innerHTML = "";

  art.questions.forEach((qObj, idx) => {
    const uAns = answers[idx];
    const cAns = qObj.correct;
    const isCorrect = uAns === cAns;
    const row = document.createElement("button");
    row.onclick = () => jumpToQuestion(idx);
    row.className = `w-full text-left px-2.5 py-1.5 rounded-lg border text-[11px] flex items-center justify-between gap-2 transition ${
      isCorrect ? "bg-emerald-50 border-emerald-300" : "bg-rose-50 border-rose-300"
    }`;
    row.innerHTML = `
      <div class="min-w-0 flex-1">
        <div class="font-bold text-slate-800 truncate">Q${idx + 1}: ${qObj.q}</div>
        <div class="truncate mt-0.5">
          <span class="${isCorrect ? "text-emerald-700 font-bold" : "text-rose-700 font-semibold"}">
            You: ${letters[uAns]}) ${qObj.options[uAns]}
          </span>
          ${!isCorrect ? `<span class="text-emerald-800 font-extrabold ml-1">• Ans: ${letters[cAns]}) ${qObj.options[cAns]}</span>` : ""}
        </div>
      </div>
      <span class="text-xs font-extrabold shrink-0 ${isCorrect ? "text-emerald-700" : "text-rose-700"}">${isCorrect ? "✓" : "✕"}</span>
    `;
    list.appendChild(row);
  });
}

function toggleSummaryModal(forceState) {
  const overlay = document.getElementById("summaryOverlay");
  if (!overlay) return;
  const isHidden = overlay.classList.contains("hidden");
  const nextState = typeof forceState === "boolean" ? forceState : isHidden;

  if (nextState && storySubmitted[currentArticleIdx]) {
    populateSummaryOverlay();
    overlay.classList.remove("hidden");
    overlay.classList.add("flex");
  } else {
    overlay.classList.add("hidden");
    overlay.classList.remove("flex");
  }
}

function retryArticle() {
  userAnswers[currentArticleIdx] = [null, null, null, null];
  storySubmitted[currentArticleIdx] = false;
  currentQuestionIndices[currentArticleIdx] = 0;
  toggleSummaryModal(false);
  renderAll("fade", "fade");
}

// ============================================================================
// ZONE-AWARE SWIPE GESTURES
// ============================================================================
function changeArticle(delta) {
  const nextIdx = (currentArticleIdx + delta + articles.length) % articles.length;
  currentArticleIdx = nextIdx;
  toggleSummaryModal(false);
  renderAll(delta > 0 ? "next" : "prev", "fade");
}

function jumpToArticle(idx) {
  if (idx === currentArticleIdx) return;
  const dir = idx > currentArticleIdx ? "next" : "prev";
  currentArticleIdx = idx;
  toggleSummaryModal(false);
  renderAll(dir, "fade");
}

function attachHorizontalSwipe(element, onSwipeLeft, onSwipeRight) {
  let startX = 0;
  let startY = 0;
  let dragging = false;

  element.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  }, { passive: true });

  element.addEventListener("touchend", (e) => {
    if (e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        if (dx < 0) onSwipeLeft();
        else onSwipeRight();
      }
    }
  }, { passive: true });

  element.addEventListener("mousedown", (e) => {
    startX = e.clientX;
    startY = e.clientY;
    dragging = true;
  });

  element.addEventListener("mouseup", (e) => {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      if (dx < 0) onSwipeLeft();
      else onSwipeRight();
    }
  });
}

// Bind Top Half to Story Swiping & Bottom Half to Question Swiping
const topHalfEl = document.getElementById("topHalf");
const bottomHalfEl = document.getElementById("bottomHalf");

if (topHalfEl) {
  attachHorizontalSwipe(
    topHalfEl,
    () => changeArticle(1),
    () => changeArticle(-1)
  );
}

if (bottomHalfEl) {
  attachHorizontalSwipe(
    bottomHalfEl,
    () => changeQuestion(1),
    () => changeQuestion(-1)
  );
}

// Initialize App on Load
window.onload = () => {
  applyViewportLayout();
  renderAll("fade", "fade");
};
</script>
